# 完整建置與發布管線：
# 測試 → assembleDebug → assembleRelease（R8 混淆＋簽章）→ 產物命名 → GitHub Release
# Release 建立失敗時，fallback 將 APK commit 至 output/ 供直接下載
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, build and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # Room schema 匯出（v5 起）：建置時產生的 schema JSON commit 回倉庫，供未來遷移比對
      - name: Commit Room schemas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/schemas/
          if ! git diff --cached --quiet; then
            git commit -m "chore: 匯出 Room schema JSON（建置產物，v5）"
            git pull --rebase
            git push
          fi

      - name: Lint（Error 等級問題會讓建置失敗）
        run: |
          ./gradlew lintDebug --no-daemon || {
            echo "===== Lint 錯誤清單 ====="
            cat "app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt" || true
            exit 1
          }

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 簽章讀取順序：Secrets → 都沒有則 fallback debug 簽章（gradle 內處理）；金鑰檔案不入庫
      - name: Decode keystore from Secrets
        id: secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/hmoney-release.p12"
            echo "file=$RUNNER_TEMP/hmoney-release.p12" >> "$GITHUB_OUTPUT"
          else
            echo "無 KEYSTORE_BASE64 Secret，release 改用 debug 簽章"
          fi

      - name: Assemble release APK (R8 + signing)
        env:
          KEYSTORE_FILE: ${{ steps.secrets.outputs.file }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename artifacts
        id: version
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Hmoney-v$VERSION-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/Hmoney-v$VERSION-release.apk"
          ls -la dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hmoney-v${{ steps.version.outputs.version }}
          path: dist/*.apk

      - name: Create tag and GitHub Release
        id: release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          # 同版本重跑時加上時間後綴，避免 tag 衝突
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            TAG="$TAG-$(date +%Y%m%d%H%M%S)"
          fi
          gh release create "$TAG" \
            --title "幻帳 Hmoney $TAG" \
            --notes "幻帳（Hmoney）$TAG。可直接下載 APK 安裝（建議使用 release 版）。" \
            "dist/Hmoney-v$VERSION-debug.apk" \
            "dist/Hmoney-v$VERSION-release.apk"

      # Release 失敗 fallback：APK commit 至 output/，不中斷交付
      - name: Fallback - commit APKs to output/
        if: steps.release.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p output
          cp "dist/Hmoney-v$VERSION-debug.apk" "dist/Hmoney-v$VERSION-release.apk" output/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "ci: 發布 v$VERSION APK 至 output/（Release 建立失敗的 fallback）"
          git push
